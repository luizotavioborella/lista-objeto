    <script>
        //Crie um objeto contendo o nome do cliente, o valor da refeição e a porcentagem da taxa de serviço. Adicione métodos 
        // para solicitar os dados, calcular a taxa, calcular o valor total e exibir o resumo do pedido.

        var pedido ={
            nome: "",
            valor_refeicao: 0,
            taxa_servico: 0,
        solicitarDados(){
            this.nome = prompt("Digite seu nome :")
            this.refeicao = Number(prompt("Digite o valor da refeição: "))
            this.taxa_servico = Number(prompt("Digite a taxa de serviço em número decimal: "))
            var calcular = this.refeicao * this.taxa_servico
            var total = this.refeicao + calcular
            alert("O valor total da refeição com a taxa de serviço foi: " + total)
        }
        }
        pedido.solicitarDados()

    </script>
